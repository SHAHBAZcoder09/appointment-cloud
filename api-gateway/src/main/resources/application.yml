server:
  port: 7000

spring:
  application:
    name: api-gateway
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: service-patient
          uri: lb://service-patient
          predicates:
            - Path=/patient/**
        - id: service-schedule
          uri: lb://service-schedule
          predicates:
            - Path=/schedule/**
        - id: service-appointment
          uri: lb://service-appointment
          predicates:
            - Path=/appointment/**
